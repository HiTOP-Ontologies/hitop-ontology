name: Ontology Lab task
description: Track a technical release-readiness task for the HiTOP Ontology (repo, CI, ontology artifacts, schema).
title: "TECH-Tx-xx: "
labels:
  - ontology-lab
body:
  - type: input
    id: task-id
    attributes:
      label: Task ID
      description: Stable task identifier, e.g. TECH-T1-01
      placeholder: TECH-T1-01
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: Aufgabe
      description: What needs to be built, decided, or fixed.
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Deliverable
      description: The concrete output that closes this task (a file, a pipeline, a decision record, ...).
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priorität
      options:
        - P0 (Release-Blocker)
        - P1 (starke Annahmebedingung fürs Paper)
        - P2 (Politur)
    validations:
      required: true
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Person responsible for this task.
    validations:
      required: false
