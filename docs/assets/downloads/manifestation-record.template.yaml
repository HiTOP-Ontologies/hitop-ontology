# HiTOP manifestation record starter template
#
# Replace every value enclosed in <...> before validation or publication.
# Required fields are active. Optional fields are commented out and can be
# enabled when relevant. Generate namespace tokens and slugs with hitop-suffix;
# do not invent or edit generated values manually.

# Required: <BASE_CODE>.M-<TYPE>-<NAMESPACE_TOKEN>-<SLUG>
code: "<REPLACE_WITH_COMPLETE_MANIFESTATION_CODE>"

# Required: exactly 6 alphanumeric characters; pattern [A-Za-z0-9][0-9][A-Za-z0-9]{4}
hitop_base_code: "<REPLACE_WITH_HITOP_BASE_CODE>"

# Required: literal value M
suffix_block: "M"

# Required: one of GS, CS, SY, AF, CG, PC, BH, SS, SL, SU, IR, IM
manifestation_type: "<REPLACE_WITH_MANIFESTATION_TYPE>"

namespace:
  # Required: generated value matching [A-Z]{3}[A-Z2-7]{13}
  token: "<REPLACE_WITH_GENERATED_NAMESPACE_TOKEN>"
  # Required: one of HTP, ROR, ORC, DOI, ARK, DNS, SRC
  kind: "<REPLACE_WITH_NAMESPACE_KIND>"
  # Required: stable canonical authority identifier used to generate the token
  identifier: "<REPLACE_WITH_CANONICAL_AUTHORITY_IDENTIFIER>"
  # Optional
  # label: "<REPLACE_WITH_AUTHORITY_LABEL>"
  # acronym: "<REPLACE_WITH_AUTHORITY_ACRONYM>"

# Required: 3-40 characters; uppercase A-Z, digits 0-9, and internal underscores
slug: "<REPLACE_WITH_NORMALIZED_SLUG>"

# Required: human-readable source label and definition
preferred_label: "<REPLACE_WITH_PREFERRED_LABEL>"
definition: "<REPLACE_WITH_CONTEXT_SPECIFIC_DEFINITION>"

source:
  # Required
  study_id: "<REPLACE_WITH_STABLE_STUDY_OR_DATASET_ID>"
  instrument: "<REPLACE_WITH_INSTRUMENT_NAME_OR_ID>"
  # Conditional: enable at least one of item_id or local_concept_id
  item_id: "<REPLACE_WITH_STABLE_ITEM_ID>"
  # local_concept_id: "<REPLACE_WITH_STABLE_LOCAL_CONCEPT_ID>"
  # Optional
  # citation: "<REPLACE_WITH_DOI_OR_BIBLIOGRAPHIC_REFERENCE>"
  # source_url: "<REPLACE_WITH_HTTPS_SOURCE_URL>"

# Required: active, deprecated, replaced, or draft
status: "draft"
# Required: ISO 8601 date (YYYY-MM-DD)
created: "<REPLACE_WITH_YYYY-MM-DD>"
# Required: record version string
version: "<REPLACE_WITH_RECORD_VERSION>"

# Optional labels
# alt_labels:
#   - "<REPLACE_WITH_ALTERNATIVE_LABEL>"

# Optional operationalization details
# operationalization:
#   instrument: "<REPLACE_WITH_INSTRUMENT_NAME_OR_ID>"
#   item_id: "<REPLACE_WITH_ITEM_ID>"
#   item_text: "<REPLACE_WITH_ITEM_TEXT_OR_CONTROLLED_REFERENCE>"
#   response_scale: "<REPLACE_WITH_RESPONSE_SCALE>"
#   time_window: "<REPLACE_WITH_OBSERVATION_OR_RECALL_PERIOD>"
#   threshold: "<REPLACE_WITH_THRESHOLD>"
#   scoring_rule: "<REPLACE_WITH_SCORING_RULE>"
#   scale_type: "<REPLACE_WITH_SCALE_TYPE>"
#   value_range: "<REPLACE_WITH_VALUE_RANGE_OR_VALUE_SET>"
#   selection_type: "<REPLACE_WITH_SELECTION_BEHAVIOR>"
#   data_type: "<REPLACE_WITH_RESPONSE_DATA_TYPE>"

# Optional population context
# population:
#   description: "<REPLACE_WITH_POPULATION_DESCRIPTION>"
#   age_range: "<REPLACE_WITH_AGE_RANGE>"
#   setting: "<REPLACE_WITH_SETTING>"

# Conditional: required only when the slug has a collision disambiguator
# base_slug: "<REPLACE_WITH_BASE_SLUG>"
# disambiguator: "<REPLACE_WITH_6_CHARACTER_BASE32_VALUE>"
# disambiguation_basis: "<REPLACE_WITH_CANONICAL_DISAMBIGUATION_BASIS>"

# Optional lifecycle and mapping fields
# modified: "<REPLACE_WITH_YYYY-MM-DD>"
# replaces: []
# replaced_by: []
# mapping_review_status: "unreviewed"
# mappings:
#   - target_code: "<REPLACE_WITH_TARGET_MANIFESTATION_CODE>"
#     relation: "skos:closeMatch"
#     mapping_artifact: "<REPLACE_WITH_MAPPING_ARTIFACT_REFERENCE>"

# Optional provenance
# provenance:
#   created_by: "<REPLACE_WITH_PERSON_OR_SYSTEM_ID>"
#   created_at: "<REPLACE_WITH_YYYY-MM-DD>"
#   reviewed_by: []
#   review_status: "draft"
#   decision_note: "<REPLACE_WITH_DECISION_NOTE>"

# Optional producer-specific extension. Names must match ^x_[A-Za-z0-9_]+$.
# Use only when no equivalent core field exists.
# x_example_extension: "<REPLACE_WITH_EXTENSION_VALUE>"
