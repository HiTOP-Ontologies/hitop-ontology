# V10dzp — HiTOP DZPG Minimal Data Set
meta:
  factorization_id: dzpg-mds
  version: V10dzp
  label: "HiTOP DZPG Minimal Data Set"
  status: draft
  source: "docs/audit/20260615T191039+0200_hitop_ontology_release_audit/DZPG MDS Adult + HiTOP.xlsx (Reiter 'HiTOP Section')"
  based_on:
    ontology_iri: "http://purl.org/hitop"
    ontology_version: "0.1.0"
  provenance:
    created_by: "Dr. Rogério Blitz & Dr. André Kerber"
    created_at: "2026-07-03"

hierarchy:
  label: General Factor of Psychopathology
  level: Factor
  code: F001Hw
  children:

    # PF_identity_2, PF_identity_5, PF_self_reflection_2
    - label: Identity problems
      level: Trait
      code: T00Eht
    # PF_affect_diff_2, PF_affect_tolrnce_1
    - label: Emotional lability
      level: Trait
      code: T008mD
    # PF_intern_relshp_mod_4, PF_affect_comm_1
    - label: Negative relationships
      level: Trait
      code: T00Fe0
    # PF_self_est_reg_1
    - label: Fragility
      level: Trait
      code: T00G3d

    - label: Internalizing
      level: Spectrum
      code: P002nf
      children:
        - label: Distress
          level: Subfactor
          code: U004dm
          children:
            - label: Dysphoria
              level: Component
              code: C00VHv
            # DASS21_17 "fühlte mich als Person nicht viel wert" -- kein
            # exaktes Kern-Aequivalent, (low) Wellbeing als naechstliegender
            # Distress-Proxy :: C00e0L = (low) Wellbeing
            - label: Low self esteem
              level: Component
              kind: collection
              code: COLLselfest
              provisional: true
              children:
                - label: (low) Wellbeing
                  level: Component
                  code: C00e0L
            # DSM5CC_6 + PHQ4_3 "nervös, ängstlich, angespannt" -- generisch,
            # getrennt von "Worries" (PHQ4_4, gezielt Sorgenkontrolle) :: T007eM = Anxiousness
            - label: Anxiousness
              level: Trait
              code: T007eM
            - label: Generalized Anxiety Disorder Symptoms
              level: Component
              code: C00fKQ
            - label: Lassitude
              level: Component
              code: C00WJc
            - label: Appetite loss
              level: Component
              code: C00cSn
            # PCPTSD5_2 "vermieden, daran zu denken" -> Avoidance;
            # PCPTSD5_3 "staendig wachsam" ueberschneidet sich mit dem
            # bereits vorhandenen Hyperarousal-Knoten (bridge statt Duplikat)
            # C00hPJ = Avoidance
            # PCPTSD5_3 ist Hyperarousal dafür brauchen wir keine Bridge
            - label: Avoidance
              level: Component
              code: C00hPJ
            - label: Hyperarousal
              level: Component
              code: C00iAh
        - label: Fear
          level: Subfactor
          code: U0036N
          children:
            - label: Panic
              level: Component
              kind: collection
              code: COLLpani
              children:
                - label: Physiological panic
                  level: Component
                  code: C00Q1t
                - label: Psychological panic
                  level: Component
                  code: C00RGy
            - label: (Agora)phobia
              level: Component
              kind: collection
              code: COLLPhobia
              children:
                - label: Public places
                  level: Component
                  code: C00LqY
                - label: Enclosed spaces
                  level: Component
                  code: C00Mpl
            - label: Social phobia
              level: Component
              kind: collection
              code: COLLSoc
              children:
                - label: Interactive anxiety
                  level: Component
                  code: C00JTU
                - label: Performance anxiety
                  level: Component
                  code: C00KL0
            - label: OCD
              level: Component
              kind: collection
              code: COLLOcd
              children:
                - label: Pure obsessions
                  level: Component
                  code: C00mpe
        - label: Eating Pathology
          level: Subfactor
          code: U002SC
          children:
            - label: ED Bulimic
              level: Component
              kind: collection
              code: COLLedbul
              provisional: true
              children:
                - label: Binge eating
                  level: Component
                  code: C01s9T
            - label: ED Anorectic
              level: Component
              kind: collection
              code: COLLedanore
              provisional: true
              children:
                - label: Restricting
                  level: Component
                  code: C01wSl

    - label: Somatoform
      level: Spectrum
      code: P001Y2
      children:
        - label: Somatization
          level: Component
          code: C00217

    - label: Thought Disorder
      level: Spectrum
      code: P003SL
      children:
        - label: Dissociation
          level: Component
          code: C00kEN
        - label: Perceptual dysregulation
          level: Trait
          code: T00vjR
          # Cognitive Perceptual Dysregulation sind 2 Codes . in ontology anpassen. alle faktorisierungen anpassen, sofern notwendig
        - label: Unusual beliefs and Experiences
          level: Trait
          code: T00wk6
        - label: Psychotic
          level: Component
          code: C00qSD

    - label: Detachment
      level: Spectrum
      code: P004R1
      children:
        # DSM5CC_1a "wenig Interesse an Aktivitaeten MIT ANDEREN" -- die
        # soziale Komponente ist der Kern des Items, kein separater
        # "Social Anhedonia"-Code im Kern vorhanden
        # T013F1 = Disaffiliativeness
        - label: Disaffiliativeness
          level: Trait
          code: T013F1
        - label: Anhedonia
          level: Trait
          code: T01hQc
        - label: Restricted affectivity
          level: Trait
          kind: collection
          code: COLLResaffect
          provisional: true
          children:
            - label: (low) Restricted Affectivity
              level: Trait
              code: T00BXK
        - label: Intimacy avoidance
          level: Trait
          code: T00zDk
        - label: Withdrawal
          level: Trait
          code: T011K6

    - label: Disinhibited Externalizing
      level: Spectrum
      code: P005xY
      children:
        - label: Irritability
          level: Component
          code: C00l5y
        - label: Problematic Impulsivity
          level: Trait
          code: T015o8
        - label: Risk taking
          level: Trait
          code: T019Cj
        - label: Distractibility
          level: Trait
          code: T018ir
        - label: Harmful Substance Use
          level: Subfactor
          code: U0061L
          children:
            - label: Alcohol use # DSM5CC_21
              level: Component
              code: C01DAb
            - label: Smoking # DSM5CC_22
              level: Component
              code: COLLsmok
              provisional: true
              kind: collection
              children:
                - label: Substance Use
                  level: Component
                  code: C02EBv
            - label: Drug problems # DSM5CC_23a
              level: Component
              code: C01Ip4
            - label: Drug use # DSM5CC_23a2
              level: Component
              code: C01HGq
        - label: Antisocial Behavior
          level: Subfactor
          code: U007EJ
          bridge:
            - Disinhibited Externalizing
            - Antagonistic Externalizing
          children:
            # PF_impulse_reg_1 "voller Wut, koennte Kontrolle verlieren"
            - label: Aggression
              level: Trait
              code: COLLaggr
              kind: collection
              provisional: true
              children:
                - label: Relational Aggression
                  level: Trait
                  code: C01LSp
                - label: Destructive Aggression
                  level: Trait
                  code: C01KXo
                - label: Physical Aggression
                  level: Trait
                  code: C01JH8
            # DI_normviolation "aufregende Dinge, auch wenn gegen das Gesetz"
            - label: Excitement seeking
              level: Trait
              code: T01W1E

    - label: Antagonistic Externalizing
      level: Spectrum
      code: P006gM
      children:
        - label: Deceitfulness
          level: Trait
          code: T01Ziz
        # AN_entitlement -- kein exakter Kern-Code, Grandiosity/Entitlement
        # sind im AMPD-Antagonismus-Modell eng verwandte Facetten Vorschlag Grandiosity
        # T01a7u = Grandiosity
        - label: Grandiosity
          level: Trait
          code: T01a7u
        - label: Hostility
          level: Trait
          code: T0094I
        - label: Manipulativeness
          level: Trait
          code: T01bz7
