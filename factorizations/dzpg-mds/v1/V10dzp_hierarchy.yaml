# V10dzp — HiTOP DZPG Minimal Data Set
meta:
  factorization_id: dzpg-mds
  version: V10dzp
  label: "HiTOP DZPG Minimal Data Set"
  status: draft
  source: "docs/audit/20260615T191039+0200_hitop_ontology_release_audit/DZPG MDS Adult + HiTOP.xlsx (Reiter 'HiTOP Section')"
  based_on:
    ontology_iri: "http://purl.org/hitop"
    ontology_version: "0.1.0"
  provenance:
    created_by: "Dr. Rogério Blitz & Dr. André Kerber"
    created_at: "2026-07-03"

hierarchy:
  label: General Psychopathology
  level: Factor
  code: F001Hw
  children:

    # PF_identity_2, PF_identity_5
    - label: Identity problems
      level: Trait
      code: T00Eht
    # PF_affect_comm_1, PF_affect_diff_2, PF_affect_tolrnce_1
    - label: Affect regulation
      level: Trait
      code: T008mD
      provisional: true
    # PF_intern_relshp_mod_4
    - label: Negative relationships
      level: Trait
      code: T00Fe0
      provisional: true
    # PF_self_est_reg_1
    - label: Fragility
      level: Trait
      code: T00G3d
      provisional: true
    # PF_self_reflection_2
    - label: Ineptitude
      level: Trait
      code: T00HCy
      provisional: true

    - label: Internalizing
      level: Spectrum
      code: P002nf
      children:
        - label: Distress
          level: Subfactor
          code: U004dm
          children:
            - label: Dysphoria
              level: Component
              code: C00VHv
            # DASS21_17 "fühlte mich als Person nicht viel wert" -- kein
            # exaktes Kern-Aequivalent, (low) Wellbeing als naechstliegender
            # Distress-Proxy :: C00e0L = (low) Wellbeing
            - label: Low self esteem
              level: Component
              code: C00e0L
              provisional: true
            # C00fKQ = Generalized Anxiety Disorder Symptoms
            - label: Worries
              level: Component
              code: C00fKQ
            # DSM5CC_6 + PHQ4_3 "nervös, ängstlich, angespannt" -- generisch,
            # getrennt von "Worries" (PHQ4_4, gezielt Sorgenkontrolle) :: T007eM = Anxiousness
            - label: Free floating anxiety
              level: Component
              code: T007eM
              provisional: true
            - label: Hyperarousal
              level: Component
              code: C00iAh
            - label: Lassitude
              level: Component
              code: C00WJc
            - label: Appetite loss
              level: Component
              code: C00cSn
            # PCPTSD5_2 "vermieden, daran zu denken" -> Avoidance;
            # PCPTSD5_3 "staendig wachsam" ueberschneidet sich mit dem
            # bereits vorhandenen Hyperarousal-Knoten (bridge statt Duplikat)
            # C00hPJ = Avoidance
            - label: Traumascreening
              level: Component
              code: C00hPJ
              provisional: true
              bridge: [Hyperarousal]
        - label: Fear
          level: Subfactor
          code: U0036N
          children:
            - label: Panic
              level: Component
              kind: collection
              code: COLLpani
              children:
                - label: Physiological panic
                  level: Component
                  code: C00Q1t
                - label: Psychological panic
                  level: Component
                  code: C00RGy
            - label: (Agora)phobia
              level: Component
              kind: collection
              code: COLLPhobia
              children:
                - label: Public places
                  level: Component
                  code: C00LqY
                - label: Enclosed spaces
                  level: Component
                  code: C00Mpl
            - label: Social phobia
              level: Component
              kind: collection
              code: COLLSoc
              children:
                - label: Interactive anxiety
                  level: Component
                  code: C00JTU
                - label: Performance anxiety
                  level: Component
                  code: C00KL0
            - label: OCD
              level: Component
              kind: collection
              code: COLLOcd
              children:
                - label: Pure obsessions
                  level: Component
                  code: C00mpe
        - label: Eating
          level: Subfactor
          code: U002SC
          children:
            - label: ED Bulimic
              level: Component
              code: C01s9T
              provisional: true
            - label: ED Anorectic
              level: Component
              code: C01wSl
              provisional: true

    - label: Somatoform
      level: Spectrum
      code: P001Y2
      children:
        - label: Somatization
          level: Component
          code: C00217

    - label: Thought Disorder
      level: Spectrum
      code: P003SL
      children:
        - label: Dissociation
          level: Component
          code: C00kEN
        - label: Perceptual dysregulation
          level: Trait
          code: T00vjR
        - label: Unusual beliefs
          level: Trait
          code: T00wk6
        - label: Psychotic symptoms
          level: Component
          code: C00qSD

    - label: Detachment
      level: Spectrum
      code: P004R1
      children:
        # DSM5CC_1a "wenig Interesse an Aktivitaeten MIT ANDEREN" -- die
        # soziale Komponente ist der Kern des Items, kein separater
        # "Social Anhedonia"-Code im Kern vorhanden
        # T013F1 = Disaffiliativeness
        - label: Social Anhedonia
          level: Trait
          code: T013F1
          provisional: true
        - label: Anhedonia
          level: Trait
          code: T01hQc
        - label: Restricted affectivity
          level: Trait
          code: T00BXK
        - label: Intimacy avoidance
          level: Trait
          code: T00zDk
        - label: Withdrawal
          level: Trait
          code: T011K6

    - label: Disinhibited Externalizing
      level: Spectrum
      code: P005xY
      children:
        # PF_impulse_reg_1 "voller Wut, koennte Kontrolle verlieren"
        # T01Neb = Impatient Urgency
        - label: Regulation aggessive impulses
          level: Trait
          code: T01Neb
          provisional: true
        - label: Irritability
          level: Component
          code: C00l5y
        - label: Impulsivity
          level: Trait
          code: T015o8
        # DI_normviolation "aufregende Dinge, auch wenn gegen das Gesetz"
        # T01UGN = Rebelliousness
        - label: Norm violation
          level: Trait
          code: T01UGN
          provisional: true
        - label: Risk taking
          level: Trait
          code: T019Cj
        - label: Distractibility
          level: Trait
          code: T018ir
        - label: Harmful Substance Use
          level: Subfactor
          code: U0061L

    - label: Antagonistic Externalizing
      level: Spectrum
      code: P006gM
      children:
        - label: Deceitfulness
          level: Trait
          code: T01Ziz
        # AN_entitlement -- kein exakter Kern-Code, Grandiosity/Entitlement
        # sind im AMPD-Antagonismus-Modell eng verwandte Facetten
        # T01a7u = Grandiosity
        - label: Entitlement
          level: Trait
          code: T01a7u
          provisional: true
        - label: Hostility
          level: Trait
          code: T0094I
        - label: Manipulativeness
          level: Trait
          code: T01bz7
