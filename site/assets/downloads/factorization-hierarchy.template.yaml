# HiTOP factorization hierarchy starter template
#
# Replace every value enclosed in <...> before validation or generation.
# Required fields are active. Optional fields are commented out and can be
# enabled when relevant. Validate with validation/test_factorizations.py,
# then generate RDF and diagram data with
# scripts/generate_factorization_ontology.py and
# scripts/generate_factorization_diagram_data.py.

meta:
  # Required: stable kebab-case id matching the factorizations/<id> directory name
  factorization_id: "<REPLACE_WITH_FACTORIZATION_ID>"
  # Required: matches this file's <version>_hierarchy.yaml filename prefix
  version: "<REPLACE_WITH_VERSION>"
  # Required: human-readable factorization name
  label: "<REPLACE_WITH_FACTORIZATION_LABEL>"
  # Required: draft, active, or deprecated
  status: "draft"
  # Optional: origin of the factor structure, e.g. a source image or dataset path
  # source: "<REPLACE_WITH_SOURCE_IMAGE_OR_DATASET_PATH>"
  # Optional: citation for the publication this factorization is derived from
  # paper: "<REPLACE_WITH_PUBLICATION_CITATION>"

  based_on:
    # Required: always this exact value
    ontology_iri: "http://purl.org/hitop"
    # Required: the owl:versionInfo state that code values were resolved against
    ontology_version: "<REPLACE_WITH_ONTOLOGY_VERSION>"
    # Optional: git commit hash pinning the exact ontology state codes were resolved against
    # commit: "<REPLACE_WITH_GIT_COMMIT_HASH>"

  provenance:
    # Required: person or role who curated this factorization
    created_by: "<REPLACE_WITH_CREATOR_NAME_OR_ROLE>"
    # Required: ISO 8601 date (YYYY-MM-DD)
    created_at: "<REPLACE_WITH_YYYY-MM-DD>"
    # Optional: free-text notes, e.g. differences from a previous version
    # notes: "<REPLACE_WITH_PROVENANCE_NOTES>"

# Required key. The value itself MAY be left as null only while meta.status
# is "draft" and the tree has not been populated yet.
hierarchy:
  # Required: human-readable name of the HiTOP concept at this node
  label: "<REPLACE_WITH_ROOT_NODE_LABEL>"
  # Required: free text naming this node's role in this factorization
  level: "<REPLACE_WITH_ROOT_NODE_LEVEL>"
  # Required: hitop_base_code from ontology/hitop.ttl; for kind: collection,
  # a factorization-local id instead
  code: "<REPLACE_WITH_ROOT_NODE_CODE>"
  # Optional: concept (default) or collection
  # kind: "concept"
  # Optional: marks this node's placement as tentative, independent of meta.status
  # provisional: true
  # Optional: other node labels this concept empirically cross-loads onto
  # bridge:
  #   - "<REPLACE_WITH_OTHER_NODE_LABEL>"

  # Optional: child nodes, one level deeper. Repeat this node shape for
  # every node in the tree; nesting under children is what orders the
  # hierarchy (hitop:hasTier) and determines each node's depth.
  # children:
  #   - label: "<REPLACE_WITH_CHILD_NODE_LABEL>"
  #     level: "<REPLACE_WITH_CHILD_NODE_LEVEL>"
  #     code: "<REPLACE_WITH_CHILD_NODE_CODE>"
